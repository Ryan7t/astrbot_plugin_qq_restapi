name: astrbot_plugin_qq_restapi # 插件唯一识别名
display_name: QQ REST API 适配器 # 用于展示的名字
desc: QQ 官方 REST API 平台适配器，不依赖 botpy，直接 HTTP 调用官方接口。支持 WebSocket/Webhook 双模式、35+ 事件类型、Markdown 模板、按钮面板、自动事件处理等 # 插件简短描述
version: v0.1.1 # 插件版本号
author: Wanyi # 作者
social_link: https://github.com/Ryan7t
repo: https://github.com/Ryan7t/astrbot_plugin_qq_restapi # 插件仓库地址
astrbot_version: ">=4.26.0" # 要求的 AstrBot 最低版本
default_config_tmpl:
  appid: your_appid # QQ 机器人 AppID
  secret: your_secret # QQ 机器人密钥
  intent_mask: null # Intents 掩码（留空使用默认）
  use_union_id_for_group: true # 群聊/单聊是否优先使用跨场景一致的 Union OpenID
  use_union_id_for_channel: true # 频道场景是否优先使用跨场景一致的 Union OpenID
  markdown_aj_template_id: "" # AJ 万能模板 ID（可空）
  markdown_aj_keys: "" # AJ 万能模板参数键名（逗号分隔，可空）
  image_bed_channel_id: "" # QQ 图床子频道 ID（可空）
  bilibili_image_bed_config: {} # B 站图床配置（可空）
  bot_api_base_url: "" # private_bot 业务后端 API 地址（可空）
  debug_event_log: false # 输出事件类型、字段摘要和解析结果调试日志
  full_group_reply:
    mode: normal # 全量群消息回复模式：normal/random_reply/all_as_at/smart_reply/smart_random
    random_probability: 0.05 # random_reply 模式下纯随机回复概率
    random_cooldown_seconds: 0 # random_reply 命中后的同群冷却秒数，0 表示不冷却
    smart_sample_probability: 0.2 # smart_random 模式下进入判断模型前的抽样概率，smart_reply 不使用
    smart_cooldown_seconds: 60 # smart_reply/smart_random 命中后的同群冷却秒数，0 表示不冷却
    smart_judge_provider_id: "" # 判断模型 Provider ID，留空使用当前会话默认模型
    smart_judge_timeout_seconds: 8.0 # 判断模型超时秒数
    smart_recent_context_messages: 20 # 仅判断模型读取的最近历史条数，不影响正式 LLM 回复上下文
    smart_judge_prompt: "" # 判断模型系统提示词，留空使用内置提示词
    per_group_ordered_decision: true # 同群按收到顺序执行抽样/判断
    max_pending_per_group: 32 # 同群待判断消息上限，0 表示不限制
    debug_log: false # 输出回复策略调试日志
  group_add_robot_message: "欢迎加入，本机器人已入群～" # 入群欢迎消息（为空则不发送）
  group_member_add_message: "" # 普通群成员入群欢迎消息（为空则不发送）
  friend_add_message: "你好，我是小万，欢迎添加好友～" # 好友添加欢迎消息（为空则不发送）
  new_user_welcome_message: "欢迎第一次和我聊天～" # 首次对话欢迎消息（为空则不发送）
  enable_group_remove_notice: false # 退群提示开关
  enable_friend_remove_notice: false # 删好友提示开关
  auto_event_log_groups:
    reaction: true
    relation: true
    group_setting: true
    group_member: true
    guild: true
    channel: true
    guild_member: true
    message_delete: true
    audit: true
    forum: true
  unified_webhook_mode: true # 统一 Webhook 入口模式
  webhook_uuid: "" # Webhook UUID（自动生成）

